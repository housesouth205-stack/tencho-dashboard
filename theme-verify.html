<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テーマ検証</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/print.css">
<link rel="stylesheet" href="assets/css/theme-dq.css">
<script>
  // 本物と同じ経路でテーマを当てる（?theme=dq で指定）
  try {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "dq") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="brand">TOHO池袋店 <b>店長ダッシュボード</b></div>
    <div class="spacer"></div>
    <div class="field"><span>年度</span><select id="fy"><option>2026年度</option></select></div>
    <div class="savestate saved">保存しました</div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<pre id="measured" style="background:#fff;color:#000;font:12px monospace;padding:8px;margin:0"></pre>

<script type="module">
import { el } from "./src/util/dom.js";
import { dailyBars } from "./src/features/yojitsu/charts.js";
import { heatColor, heatText, heat5, heatMinus, heatZero, minMax, refreshHeatPalette } from "./src/calc/heat.js";

// 本物のタブ7つ（router.js の定義と同じ並び）
const TABS = ["予実","島図・設定","機種分析","出玉率","経費","増台計画","取込","設定"];
const nav = document.getElementById("tabs");
TABS.forEach((t, i) => nav.appendChild(el("button", { class: "tab" + (i === 0 ? " active" : ""), text: t })));

const w = new URLSearchParams(location.search).get("w");
if (w) {
  const app = document.getElementById("app");
  app.style.width = w + "px";
  app.style.overflow = "hidden";
  document.body.style.width = w + "px";
}

const view = document.getElementById("view");
view.appendChild(el("div", { class: "view-title" }, [el("h1", { text: "予実管理" }), el("small", { text: "2026年8月" })]));

// --- 本物のグラフモジュールに合成データを渡す ---
const series = Array.from({ length: 31 }, (_, i) => {
  const d = new Date(2026, 7, i + 1), dow = d.getDay();
  return {
    label: String(i + 1),
    plan: 6_000_000 + (i % 5) * 400_000,
    actual: i < 14 ? 5_400_000 + (i % 7) * 900_000 : null,  // 15日以降は未入力（0で埋めない）
    kind: dow === 0 ? "sun" : dow === 6 ? "sat" : "",
  };
});
const chartCard = el("div", { class: "card col" });
chartCard.appendChild(el("h2", { text: "日別 売上（棒＝実績／横線＝計画）" }));
chartCard.appendChild(dailyBars(series, { title: "", unit: "円" }));
view.appendChild(chartCard);

// --- 本物のヒートで表を塗る ---
const vals = [1200, 2400, 3100, 3900, 4800, 5600, -300, 0];
const range = minMax(vals);
const t = el("table", { class: "grid" });
t.appendChild(el("thead", {}, el("tr", {}, [el("th", { class: "txt", text: "台番" }), el("th", { text: "アウト" }), el("th", { text: "売上" })])));
const tb = el("tbody");
vals.forEach((v, i) => {
  const c = heatColor(v, range);
  tb.appendChild(el("tr", {}, [
    el("td", { class: "txt", text: String(101 + i) }),
    el("td", { style: `background:${c};color:${heatText(c)}`, text: String(v) }),
    el("td", { text: "¥" + (v * 1200).toLocaleString("ja-JP") }),
  ]));
});
t.appendChild(tb);
const heatCard = el("div", { class: "card col", style: "margin-top:12px" }, [el("h2", { text: "ヒート（本物の heat.js）" })]);
heatCard.appendChild(el("div", { class: "table-wrap" }, t));
const box = (c) => el("span", { style: `display:inline-block;width:22px;height:16px;background:${c};border:1px solid var(--line)` });
heatCard.appendChild(el("div", { class: "row", style: "gap:4px;align-items:center;margin-top:8px" }, [
  el("span", { class: "hint", text: "低" }), ...heat5().map(box), el("span", { class: "hint", text: "高" }),
  box(heatMinus()), el("span", { class: "hint", text: "マイナス" }), box(heatZero()), el("span", { class: "hint", text: "稼働なし" }),
]));
heatCard.appendChild(el("div", { class: "row", style: "gap:8px;margin-top:10px" }, [
  el("button", { class: "btn primary", text: "取り込む" }),
  el("button", { class: "btn", text: "日報をつくる" }),
  el("span", { class: "badge s", text: "20スロ" }), el("span", { class: "badge p", text: "2スロ" }),
]));
view.appendChild(heatCard);

// --- 操作行・鮮度バー・区分バッジ・日別表（本物と同じクラス構成）---
const fresh = el("div", { class: "row", style: "gap:6px;align-items:center;flex-wrap:wrap;padding:4px 12px;font-size:12px" }, [
  el("button", { class: "btn sm ghost", style: "color:var(--accent);border-color:var(--accent);font-weight:700", text: "⚠ 日次実績: 09/03（3日前）" }),
  el("button", { class: "btn sm ghost", style: "color:var(--fg-dim)", text: "台別CSV: 08/31（6日前）" }),
  el("button", { class: "btn sm ghost", style: "color:var(--fg-dim)", text: "月次経費: 未取込" }),
  el("span", { class: "hint", text: "そろそろ更新を" }),
]);
view.insertBefore(fresh, view.children[1] || null);

const ctrl = el("div", { class: "row", style: "align-items:flex-end;gap:10px;flex-wrap:wrap;margin:10px 0 14px" }, [
  el("div", {}, [el("label", { class: "lbl", text: "年度" }),
    el("select", { class: "inp", style: "width:104px" }, [el("option", { text: "2026年度" })])]),
  el("div", {}, [el("label", { class: "lbl", text: "粒度" }),
    el("div", { class: "row", style: "gap:2px" }, [
      el("button", { class: "btn sm primary", text: "月" }),
      el("button", { class: "btn sm ghost", text: "年度" })])]),
  el("div", {}, [el("label", { class: "lbl", text: "月" }),
    el("select", { class: "inp", style: "width:90px" }, [el("option", { text: "9月" })])]),
  el("button", { class: "btn primary", text: "日別入力" }),
  el("button", { class: "btn", text: "🎯 目標粗利→計画" }),
  el("button", { class: "btn", text: "📋 日報" }),
  el("button", { class: "btn", text: "月間目標" }),
  el("button", { class: "btn ghost", text: "月計画表を取込" }),
]);
view.insertBefore(ctrl, fresh.nextSibling);

// 日別表。「+」だけ折り返して行が崩れていた欄と、折り返す見出しを再現する
const daily = el("table", { class: "grid mono" });
daily.appendChild(el("thead", {}, el("tr", {}, [
  el("th", { class: "txt", text: "日" }), el("th", { class: "txt", text: "曜" }),
  el("th", { text: "アウト/台" }), el("th", { text: "売上" }), el("th", { text: "粗利" }),
  el("th", { text: "粗利差" }), el("th", { text: "達成率(粗利)" }),
])));
const dbody = el("tbody");
[["1","火","7,395","¥3,515,600","¥649,552","+¥348,169","153.6%","#43b483"],
 ["2","水","7,395","¥3,515,600","¥649,552","+¥95,590","114.7%","#43b483"],
 ["3","木","7,395","¥3,515,600","¥649,552","−¥690,911","−6.4%","#e35d6a"],
 ["4","金","7,395","¥3,515,600","¥649,552","+¥985,121","251.7%","#43b483"]].forEach((r) => {
  dbody.appendChild(el("tr", {}, [
    el("td", { class: "txt", text: r[0] }), el("td", { class: "txt", text: r[1] }),
    el("td", { text: r[2] }), el("td", { text: r[3] }), el("td", { text: r[4] }),
    el("td", { style: `color:${r[7]};font-weight:600`, text: r[5] }),
    el("td", { style: `color:${r[7]};font-weight:600`, text: r[6] }),
  ]));
});
daily.appendChild(dbody);
const dcard = el("div", { class: "card col" }, [
  el("div", { class: "panel-title", style: "color:#6b7f9e", text: "📅 日別の実績" }),
  el("div", { class: "row", style: "gap:8px;align-items:center;margin-bottom:6px" }, [
    el("span", { class: "badge", style: "background:rgba(229,72,77,.16);color:#e5484d;font-weight:700", text: "20スロ" }),
    el("span", { class: "badge", style: "background:rgba(234,161,0,.16);color:#eaa100;font-weight:700", text: "5スロ" }),
    el("span", { class: "badge", style: "background:rgba(59,130,246,.16);color:#3b82f6;font-weight:700", text: "2スロ" }),
  ]),
  el("div", { class: "table-wrap" }, daily),
]);
view.insertBefore(dcard, ctrl.nextSibling);

// --- 実際の予実サマリーに近い形（クラスは本物と同じものを使う）---
import { hbars } from "./src/features/yojitsu/charts.js";

const panel = (title, color, items) => {
  const p = el("div", { class: "card", style: `flex:1;min-width:300px;border-top:3px solid ${color}` }, [
    el("div", { class: "panel-title", style: `color:${color}`, text: title }),
    el("div", { class: "row", style: "gap:14px;flex-wrap:wrap" }, items),
  ]);
  return p;
};
const kpi = (label, value, color, sub) => el("div", { class: "kpi-item" }, [
  el("div", { class: "hint", text: label }),
  el("div", { class: "kpi-value", style: `color:${color}`, text: value }),
  sub ? el("div", { class: "hint", text: sub }) : null,
]);
const kpiSm = (label, value, color, sub, subColor) => el("div", { class: "kpi-item sm" }, [
  el("div", { class: "hint", text: label }),
  el("div", { class: "kpi-value sm", style: `color:${color}`, text: value }),
  el("div", { class: "hint", style: `color:${subColor};font-weight:700`, text: sub }),
]);

const summary = el("div", { class: "row", style: "flex-wrap:wrap;gap:14px;align-items:stretch" });
summary.appendChild(el("div", { class: "col", style: "flex:1;min-width:320px;gap:12px" }, [
  panel("📋 計画", "#6b7f9e", [
    kpi("売上", "¥122,438,800", "#4f8ff7"),
    kpi("粗利", "¥22,630,736", "#2fb888"),
    kpi("粗利率", "18.5%", "#2fb888"),
  ]),
  panel("✅ 実績", "#1f9d70", [
    kpi("売上", "¥127,856,500", "#4f8ff7"),
    kpi("粗利", "¥22,047,039", "#2fb888"),
    kpi("粗利率", "17.2%", "#2fb888"),
  ]),
  el("div", { class: "card", style: "border-top:3px solid #8a91a3" }, [
    el("div", { class: "panel-title", style: "color:#8a91a3", text: "📅 昨年同月（2025年8月）" }),
    el("div", { class: "row", style: "gap:14px;flex-wrap:wrap" }, [
      kpiSm("売上", "¥126,062,900", "#4f8ff7", "今年 +1.4%", "#43b483"),
      kpiSm("粗利", "¥23,115,776", "#2fb888", "今年 −4.6%", "#e35d6a"),
      kpiSm("アウト/台", "9,189", "var(--fg)", "今年 −2.4%", "#e35d6a"),
      kpiSm("粗利率", "18.3%", "#2fb888", "今年 −1.1pt", "#e35d6a"),
      kpiSm("営業日数", "31日", "var(--fg)", "今年 31日", "#8a91a3"),
    ]),
    el("div", { class: "hint xs", style: "margin-top:6px",
      text: "今年の実績が入っている日にちと同じ日で昨年を集計しています（月の途中でも比べられるように）。" }),
  ]),
]));
const right = el("div", { class: "col", style: "flex:1;min-width:320px;gap:12px" });
right.appendChild(hbars([
  { label: "20スロ", plan: 16710000, actual: 15970000 },
  { label: "5スロ", plan: 4580000, actual: 4570000 },
  { label: "2スロ", plan: 1340000, actual: 1510000 },
], { title: "区分別 計画vs実績（粗利）" }));
right.appendChild(el("div", { class: "card", style: "border-top:3px solid #e0a52e" }, [
  el("div", { class: "panel-title", style: "color:#e0a52e", text: "🎯 達成状況（粗利）" }),
  el("div", { class: "row", style: "gap:14px;flex-wrap:wrap;margin-top:10px" }, [
    kpi("達成率（粗利）", "97.4%", "#e0a52e", "あと一歩（31/31日 経過）"),
    kpi("残り必要粗利", "¥583,697", "#f0a12e", "残り0日"),
    kpi("着地見込", "¥22,047,039", "#a56cf0", "実績＋残計画"),
  ]),
]));
summary.appendChild(right);
view.insertBefore(summary, dcard.nextSibling);

// --- 実測（目視ではなく数字で確認する）---
await new Promise((r) => (document.fonts ? document.fonts.ready.then(r) : r()));
requestAnimationFrame(() => {
  const cs = getComputedStyle(document.documentElement);
  const tabHeights = [...document.querySelectorAll(".tab")].map((b) => Math.round(b.getBoundingClientRect().height));
  const axisFill = document.querySelector("#view svg text")?.getAttribute("fill") || "(なし)";
  const out = [
    `theme            = ${document.documentElement.dataset.theme || "(通常)"}`,
    `--bg / --fg      = ${cs.getPropertyValue("--bg").trim()} / ${cs.getPropertyValue("--fg").trim()}`,
    `--heat-1..5      = ${[1,2,3,4,5].map((i)=>cs.getPropertyValue(`--heat-${i}`).trim()).join(" ")}`,
    `heat5() [JS]     = ${heat5().join(" ")}`,
    `グラフ目盛の色    = ${axisFill}`,
    `body font-family = ${getComputedStyle(document.body).fontFamily}`,
    `body font-size   = ${getComputedStyle(document.body).fontSize}`,
    `タブ数/高さ       = ${tabHeights.length} / [${tabHeights.join(",")}]  ← 全部同じ高さなら折り返していない`,
    `タブ scrollW/clientW = ${nav.scrollWidth} / ${nav.clientWidth}  はみ出し=${nav.scrollWidth > nav.clientWidth}（横スクロールで見える）`,
    `本文の横はみ出し  = ${document.documentElement.scrollWidth > document.documentElement.clientWidth}  ← false であること`,
    (() => {
      // どの項目が「一段大きい」側に入っているかを実測で確かめる
      const px = (sel) => { const e = document.querySelector(sel); return e ? getComputedStyle(e).fontSize : "—"; };
      return `大きさ  主要な金額 ${px(".kpi-value")} / 昨年同月 ${px(".kpi-value.sm")} / 表 ${px("table.grid td")}` +
             ` / 見出し ${px("h1")} / パネル名 ${px(".panel-title")} / 添えもの ${px(".hint")}`;
    })(),
    (() => {
      const cs = (sel, prop) => { const e = document.querySelector(sel); return e ? getComputedStyle(e)[prop] : "—"; };
      const h = (sel) => { const e = document.querySelector(sel); return e ? Math.round(e.getBoundingClientRect().height) : 0; };
      return `バッジ 背景/枠 = ${cs(".badge","backgroundColor")} / ${cs(".badge","borderTopWidth")}\n` +
        `表セル 折返し/縦位置 = ${cs("table.grid td","whiteSpace")} / ${cs("table.grid td","verticalAlign")}\n` +
        `枠の高さ btn=${h(".btn")} btn.sm=${h(".btn.sm")} select=${h("select.inp")}  ← そろっていること\n` +
        `グラフの区分名 = ${cs("svg text.hbar-label","fontSize")}`;
    })(),
    (() => {
      const pt = document.querySelector(".panel-title");
      const ch = document.querySelector(".chart-head");
      const g = (e) => { const c = e && getComputedStyle(e); return c ? `${c.backgroundColor}/${c.color}` : "?"; };
      return `見出しの帯 パネル = ${g(pt)}   グラフ = ${g(ch)}`;
    })(),
    (() => {
      const th = document.querySelector("table.grid th");
      const cs = th && getComputedStyle(th);
      return `表ヘッダ 背景/文字 = ${cs ? cs.backgroundColor : "?"} / ${cs ? cs.color : "?"}`;
    })(),
    (() => {
      const lg = document.querySelector(".chart-legend");
      const prev = lg && lg.previousElementSibling;
      return `凡例 = ${lg ? (prev && prev.classList.contains("hint") ? "見出しと同じ行" : "見出しの外") : "なし"}`;
    })(),
  ].join("\n");
  document.getElementById("measured").textContent = out;
});
</script>
</body>
</html>
