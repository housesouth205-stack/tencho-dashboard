<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family:"PM12"; src:url("assets/fonts/PixelMplus12-Regular.ttf") format("truetype"); }
@font-face { font-family:"Misaki"; src:url("assets/fonts/misaki_gothic_2nd.ttf") format("truetype"); }
body{margin:0;background:#000;color:#fff;-webkit-font-smoothing:none;font-smooth:never}
.row{padding:3px 6px;white-space:nowrap}
.lbl{font:11px system-ui;color:#8f8;padding:6px 6px 0}
</style></head><body>
<div id="o"></div>
<script>
const T = "予実管理 売上 ¥205,800,000 粗利 132.7% アウト/台 3,500";
const o = document.getElementById("o");
for (const [f, sizes] of [["PM12",[12,16,20,24,36]], ["Misaki",[8,16,24]]]) {
  for (const s of sizes) {
    const l = document.createElement("div");
    l.className = "lbl"; l.textContent = `${f} ${s}px`;
    const d = document.createElement("div");
    d.className = "row";
    d.style.font = `${s}px "${f}", monospace`;
    d.textContent = T;
    o.appendChild(l); o.appendChild(d);
  }
}
</script></body></html>
