<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOHO池袋店 店長ダッシュボード</title>
  <link rel="preconnect" href="https://ohnhtordgdjzdrhaeukz.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>
  <div id="app">
    <header class="appbar">
      <div class="brand">TOHO池袋店 <b>店長ダッシュボード</b></div>
      <div class="spacer"></div>
      <div class="field">
        <span>年度</span>
        <select id="fySelect"></select>
      </div>
      <div id="saveState" class="savestate">—</div>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <main id="view"></main>
  </div>
  <div id="toasts"></div>
  <div id="printArea"></div>
  <script type="module" src="src/main.js"></script>
  <script>
    // 更新が端末のキャッシュに阻まれて届かないのを防ぐ（sw.js がネットワーク優先にする）。
    // updateViaCache:"none" で sw.js 自身もキャッシュ経由で取らない。
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}));
    }
  </script>
</body>
</html>
