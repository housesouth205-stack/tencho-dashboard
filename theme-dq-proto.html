<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DQ風テーマ 試作</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
/* ===== ドラクエ風テーマ（theme.css のトークンを差し替えるだけ） ===== */
:root {
  --bg: #000000;
  --panel: #000000;
  --panel-2: #101038;
  --panel-3: #08081c;
  --line: #ffffff;
  --fg: #ffffff;
  --fg-dim: #a0a0b8;

  --accent: #f8d838;
  --accent-hi: #fcfc54;
  --accent-dim: #6b5a10;
  --ok: #58d858;
  --warn: #f8d838;
  --bad: #f87858;
  --blue: #58a8f8;

  --pastel-blue: #182858;
  --pastel-green: #103818;
  --pastel-yellow: #383010;
  --pastel-purple: #281848;
  --pastel-red: #481818;

  --heat-1: #204010; --heat-2: #6b7810; --heat-3: #f8d838;
  --heat-4: #f89838; --heat-5: #f85858;

  --shadow: none;
  --shadow-lg: none;
  --radius: 0px;
  --font: "Unifont", "DotGothic16", monospace;
}
/* ドット絵は等倍でないと滲む。16pxのビットマップなので16/32pxに固定する。 */
body { font-size: 16px; line-height: 1.6; -webkit-font-smoothing: none; font-smooth: never; }

/* DQのメッセージウィンドウ = 黒地に白の二重枠。角丸も影も無い。 */
.card, .modal, .toast {
  border: 4px solid #fff !important; border-radius: 0 !important;
  box-shadow: inset 0 0 0 2px #000 !important; background: #000 !important;
  padding: 18px;
}
.appbar {
  background: #000; border-bottom: 4px solid #fff; box-shadow: none;
  image-rendering: pixelated;
}
.appbar .brand b { color: var(--accent); }

/* タブ＝コマンドウィンドウ。選択中は ▶ カーソルを出す（DQの選択カーソル） */
.tabs { background: #000; border-bottom: 4px solid #fff; gap: 0; padding: 8px 12px 0; }
.tab { border-radius: 0; border-bottom: none; padding: 8px 14px; font-weight: normal; }
.tab.active { background: transparent; color: var(--accent); border-bottom: none; }
.tab.active::before { content: "▶"; margin-right: 4px; }
.tab:not(.active)::before { content: "\00a0\00a0"; margin-right: 4px; }
.tab:hover { background: #101038; color: #fff; }

/* ボタン＝コマンド枠 */
.btn { border: 3px solid #fff; border-radius: 0; background: #000; padding: 6px 14px; }
.btn:hover { background: #101038; }
.btn.primary { background: #000; color: var(--accent); border-color: var(--accent); }

table.grid { font-size: 16px; }
table.grid th, table.grid td { border: 2px solid #fff; padding: 6px 10px; }
table.grid th { background: #101038; color: #fff; }
table.grid tbody tr:nth-child(even) td { background: #08081c; }

.badge { border-radius: 0; border: 2px solid currentColor; font-weight: normal; }
.badge.s { color: var(--blue); background: #000; }
.badge.p { color: var(--bad); background: #000; }

input[type=text], input[type=number], select.inp {
  background: #000; border: 3px solid #fff; border-radius: 0; color: #fff;
}
.placeholder { border: 4px dashed #fff; border-radius: 0; }
h1, h2, h3 { font-weight: normal; }

/* ビットマップフォントは等倍でないと滲む。見出しも16の倍数に固定する。 */
h1 { font-size: 32px; line-height: 1.5; }
h2 { font-size: 16px; }
.view-title small, .hint, label.lbl, .savestate { font-size: 16px; }
.badge { font-size: 16px; padding: 1px 8px; }
.btn.sm { font-size: 16px; }
table.grid.compact th { font-size: 16px; }

</style>
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="brand">TOHO池袋店 <b>店長ダッシュボード</b></div>
    <div class="spacer"></div>
    <div class="field"><span>年度</span>
      <select><option>2026年度</option></select></div>
    <div class="savestate saved">ほぞんした</div>
  </header>
  <nav class="tabs">
    <button class="tab active">予実</button>
    <button class="tab">島図・設定</button>
    <button class="tab">機種分析</button>
    <button class="tab">出玉率</button>
    <button class="tab">経費</button>
    <button class="tab">取込</button>
    <button class="tab">設定</button>
  </nav>
  <main>
    <div class="view-title"><h1>予実管理</h1><small>2026年8月</small></div>
    <div class="row stack-md">
      <div class="card grow">
        <h2>▼ 8月14日までの合計</h2>
        <table class="grid">
          <thead><tr><th class="txt">項目</th><th>実績</th><th>昨年</th><th>前年比</th></tr></thead>
          <tbody>
            <tr><td class="txt">売上</td><td class="mono">¥205,800,000</td><td class="mono">¥160,800,000</td><td class="mono" style="color:var(--ok)">128.0%</td></tr>
            <tr><td class="txt">粗利</td><td class="mono">¥59,220,000</td><td class="mono">¥44,616,000</td><td class="mono" style="color:var(--ok)">132.7%</td></tr>
            <tr><td class="txt">アウト/台</td><td class="mono">3,500</td><td class="mono">3,345</td><td class="mono" style="color:var(--warn)">104.6%</td></tr>
          </tbody>
        </table>
        <p style="margin-top:14px">実績14日／昨年12日ぶん（おなじ日にちで つきあわせ）</p>
        <div class="row" style="margin-top:12px">
          <button class="btn primary">とりこむ</button>
          <button class="btn">日報をつくる</button>
          <button class="btn">とじる</button>
        </div>
      </div>
      <div class="card" style="min-width:300px">
        <h2>▼ 区分</h2>
        <p><span class="badge s">20スロ</span> 144台<br>
           <span class="badge p">2スロ</span> 48台<br>
           <span class="badge s">5スロ</span> 112台</p>
        <p style="color:var(--fg-dim)">ごうけい 304台</p>
        <h2 style="margin-top:18px">▼ ヒート</h2>
        <p>
          <span style="background:var(--heat-1);color:#fff;padding:2px 8px">1</span>
          <span style="background:var(--heat-2);color:#000;padding:2px 8px">2</span>
          <span style="background:var(--heat-3);color:#000;padding:2px 8px">3</span>
          <span style="background:var(--heat-4);color:#000;padding:2px 8px">4</span>
          <span style="background:var(--heat-5);color:#000;padding:2px 8px">5</span>
        </p>
      </div>
    </div>
  </main>
</div>
</body>
</html>
