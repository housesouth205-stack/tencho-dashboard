<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>島図と他画面の文字サイズ検証</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/print.css">
<link rel="stylesheet" href="assets/css/theme-dq.css">
<script>
  try { if (new URLSearchParams(location.search).get("theme") === "dq")
    document.documentElement.dataset.theme = "dq"; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header class="appbar"><div class="brand">TOHO池袋店 <b>店長ダッシュボード</b></div>
    <div class="spacer"></div><div class="savestate saved">保存しました</div></header>
  <main id="view"></main>
</div>
<pre id="measured" style="background:#fff;color:#000;font:12px monospace;padding:8px;margin:0"></pre>
<script type="module">
import { el } from "./src/util/dom.js";
import { buildPlacementMap, SET_COLORS } from "./src/features/simulator/miniMap.js";

const view = document.getElementById("view");
view.appendChild(el("div", { class: "view-title" }, [el("h1", { text: "島図・設定" }), el("small", { text: "2026/08/31" })]));

// 合成の配置データ。1F=20スロ（台番1-24）を4行×6列で置く。
const layout = [];
for (let i = 0; i < 24; i++) {
  layout.push({ dai_no: i + 1, floor: "1F", grid_row: Math.floor(i / 6) + 1, grid_col: (i % 6) + 1 });
}
const MODELS = ["スマスロ北斗の拳", "L戦国乙女5L8", "新ハナビR", "沖ドキ！GOLD"];
const placement = layout.map((l, i) => ({
  dai: l.dai_no,
  setting: (i % 6) + 1,
  model: MODELS[i % MODELS.length],
  metric: 2800 + (i % 7) * 420,
  held: i % 9 === 0,
  changed: i % 5 === 0,
  prevSetting: (i % 6) + 1 > 3 ? 1 : 6,
}));

const card = el("div", { class: "card col" }, [el("div", { class: "panel-title", style: "color:#6b7f9e", text: "🗺 島図（本物の miniMap.js）" })]);
// 凡例は buildPlacementMap が自前で出すので、ここでは足さない
card.appendChild(buildPlacementMap(layout, placement, {}));
view.appendChild(card);

// 他画面によくある「小さい直書き」の代表例をそのまま置く
const small = el("div", { class: "card col", style: "margin-top:12px" }, [
  el("div", { class: "panel-title", style: "color:#1f9d70", text: "📋 他画面によくある直書きの文字" }),
  el("div", { style: "font-size:11.5px" }, "11.5px の説明文（シミュレーター・設定・取込で多用）"),
  el("div", { style: "font-size:12px;color:var(--fg-dim)" }, "12px の添えもの（増台計画・出玉率・鮮度バー）"),
  el("div", { style: "font-size:13px;font-weight:800" }, "13px の小見出し（🏢 全体（全レート合計））"),
  el("div", { class: "row", style: "gap:6px;align-items:baseline;margin-top:6px" }, [
    el("span", { class: "hint", text: "総粗利 " }),
    el("span", { style: "font-size:22px;font-weight:800;color:#2fb888", text: "¥22,047,039" }),
    el("span", { style: "font-size:12px;font-weight:700;color:#43b483", text: "104.6%（+¥583,697）" }),
  ]),
  el("div", { class: "row", style: "gap:4px;flex-wrap:wrap;margin-top:6px" },
    [1,2,3,4,5,6].map((n) => el("span", {
      style: `font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;background:${SET_COLORS[n]};color:#333a46;border:1px solid var(--line)`,
      text: "設定" + n }))),
]);
view.appendChild(small);

await new Promise((r) => (document.fonts ? document.fonts.ready.then(r) : r()));
requestAnimationFrame(() => {
  const px = (sel) => { const e = document.querySelector(sel); return e ? getComputedStyle(e).fontSize : "—"; };
  // 島図のマスの中の文字（8px指定）が守られているか
  const cellTexts = [...document.querySelectorAll(".island-map [style*='font-size']")]
    .map((e) => getComputedStyle(e).fontSize);
  const uniq = [...new Set(cellTexts)].sort();
  const out = [
    `theme = ${document.documentElement.dataset.theme || "(通常)"}`,
    `島図のマス内の文字サイズ = ${uniq.join(", ") || "(なし)"}  ← 8px前後のままなら守られている`,
    `島図の要素数 = ${cellTexts.length}`,
    `他画面の直書き 11.5px → ${px("[style*='font-size:11.5px']")}`,
    `他画面の直書き 12px   → ${px("[style*='font-size:12px']")}`,
    `他画面の直書き 13px   → ${px("[style*='font-size:13px']")}`,
    `他画面の直書き 22px   → ${px("[style*='font-size:22px']")}  ← 強調の段`,
    `本文の横はみ出し = ${document.documentElement.scrollWidth > document.documentElement.clientWidth}  ← false であること`,
  ].join("\n");
  document.getElementById("measured").textContent = out;
});
</script></body></html>
